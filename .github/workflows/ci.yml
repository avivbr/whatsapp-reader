name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS, not Linux: package.json declares os: darwin, so `npm ci` on Linux
    # fails with EBADPLATFORM before it can install anything. Matching the only
    # platform this tool runs on is also the more meaningful test.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ is a committed artifact, not a build product: `npm i -g <tarball>`
      # and `npm link` both run it straight from the repo. A stale dist/ would
      # ship old behaviour silently, so rebuild and fail on any drift.
      - run: npm run build
      - name: dist/ must match src/
        run: git diff --exit-code -- dist
      - run: node dist/cli.js --help

      # Prove the documented install actually works, from a clean prefix.
      - name: install from a tarball the way a user would
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm_config_prefix="$RUNNER_TEMP/prefix" npm install -g "$RUNNER_TEMP"/whatsapp-reader-*.tgz
          "$RUNNER_TEMP/prefix/bin/wa" --help > /dev/null
