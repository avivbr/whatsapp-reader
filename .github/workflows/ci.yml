name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS, not Linux: package.json declares os: darwin, so `npm ci` on Linux
    # fails with EBADPLATFORM before it can install anything. Matching the only
    # platform this tool runs on is also the more meaningful test.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The build is what a consumer actually receives, so prove it emits and runs.
      - run: npm run build
      - run: node dist/cli.js --help
