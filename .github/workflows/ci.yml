name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Tests run entirely against synthetic fixtures, so they need no WhatsApp
    # install and no macOS runner. Only `wa snapshot` touches the real container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
