[project]
name = "whatsapp-reader"
version = "0.1.0"
description = "Read-only, offline reader for the WhatsApp for Mac local database, with an MCP server for Claude Code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]

[project.scripts]
wa = "whatsapp_reader.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
